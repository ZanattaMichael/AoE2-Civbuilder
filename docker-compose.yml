services:
  civbuilder:
    build:
      context: .
      dockerfile: Dockerfile
    image: aoe2-civbuilder:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      APP_DIR: /app
      BASE_PATH: ${BASE_PATH:-/civbuilder}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000/civbuilder}
      # Required in production: signs the seat cookies that authorize draft
      # actions. Generate with: openssl rand -hex 32
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Set to false when the app is served over plain HTTP rather than behind a
      # TLS-terminating proxy, or the browser discards the seat cookies and
      # upgrades every subresource request to https://.
      BEHIND_TLS: ${BEHIND_TLS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - drafts:/app/drafts
      - requested-mods:/app/modding/requested_mods
    # The mod pipeline shells out to a native binary and writes archives; it
    # needs no extra privileges beyond writing its two volumes.
    read_only: false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({host:'127.0.0.1',port:4000,path:(process.env.BASE_PATH||'/civbuilder')+'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  drafts:
  requested-mods:
